<!DOCTYPE html>
<html lang="ja" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KAIZEN // JLPT N5-N3 Mastery OS</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000000'/><text x='50%' y='68%' font-size='50' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='bold'>改</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              obsidian: '#07090E',
              surface: '#0F131C',
              surfaceLight: '#181E2B',
              borderDark: '#232A3B',
              cyanNeon: '#00F0FF',
              violetNeon: '#A855F7',
              emeraldNeon: '#10B981',
              crimsonNeon: '#FF3366',
              amberNeon: '#F59E0B'
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', '"Noto Sans JP"', 'sans-serif'],
              jp: ['"Noto Sans JP"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace']
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #07090E;
        color: #F3F4F6;
        font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      /* Custom glowing scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0B0F19;
      }
      ::-webkit-scrollbar-thumb {
        background: #232A3B;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00F0FF;
      }
    </style>
  </head>
  <body class="bg-obsidian min-h-screen text-slate-100 antialiased selection:bg-cyanNeon/30 selection:text-cyanNeon">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
