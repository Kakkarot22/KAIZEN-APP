name: Build Android (APK & AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./app
        run: npm install

      - name: Build Web App
        working-directory: ./app
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: ./app
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x app/android/gradlew

      - name: Build Android Debug APK (Install directly on phone)
        working-directory: ./app/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Android Bundle (For Play Store)
        working-directory: ./app/android
        run: ./gradlew bundle --stacktrace

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: kaizen-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: kaizen-playstore-aab
          path: app/android/app/build/outputs/bundle/**/*.aab

